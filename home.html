<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker | Home Page</title>

    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

  <!-- tailwind + daisy -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
  </script>

  <!-- font awesome for icon-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- font intregation from google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <!-- stylesheet -->
  <link rel="stylesheet" href="./style/style.css">
</head>
<body class="min-h-screen max-w-screen  bg-base-200">
  <!--Header Section -->
  <header>
    <!-- step-01 : -->
    <!-- navbar logo part -->
    <div class="flex-wrap p-4 space-y-3 md:navbar bg-base-100 shadow-sm px-10 flex justify-between">

      <div class=" flex justify-center items-center gap-2">
        <div>
          <img class="w-[40px]" src="./assets/github-logo.png" alt="">
        </div>
        <div>
          <h2 class="text-xl font-semibold">
            GitHub Issues Tracker
          </h2>
        </div>
      </div>

      <!-- Strp-02 : -->
      <!-- Using Daisy UI  -->
      <div class="flex gap-2 ">

        <!-- navbar end part -->
        <div>
          <label class="input validator join-item">
            <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </g>
            </svg>
            <input id="input-search" type="text" placeholder="Search issues..." required />
          </label>
        </div>

        <button id="issue_Search" class="btn btn-primary ">+ New Issue</button>
      </div>
    </div>
  </header>

  <!-- step-02: -->
   <!-- button section -->
  <section class=" my-6 w-11/12 mx-auto ">
    <div id="btndiv" class="bg-white p-4 rounded-xl shadow-sm">
      <button onclick=" togglebtn ('all')" id="all" class="btn text-white btn-primary">All</button>
      <button onclick="togglebtn ('open')" id="open" class="btn  ">Open</button>
      <button onclick="togglebtn('closed')" id="closed" class="btn ">Closed</button>
    </div>
  </section>
    <script src="./script/index.js"></script>
</body>
</html>
