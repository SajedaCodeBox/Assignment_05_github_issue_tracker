<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker | Home Page</title>

    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

  <!-- tailwind + daisy -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
  </script>

  <!-- font awesome for icon-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- font intregation from google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <!-- stylesheet -->
  <link rel="stylesheet" href="./style/style.css">
</head>
<body class="min-h-screen max-w-screen  bg-base-200">
  <!--Header Section -->
  <header>
    <!-- step-01 : -->
    <!-- navbar logo part -->
    <div class="flex-wrap p-4 space-y-3 md:navbar bg-base-100 shadow-sm px-10 flex justify-between">

      <div class=" flex justify-center items-center gap-2">
        <div>
          <img class="w-[40px]" src="./assets/github-logo.png" alt="">
        </div>
        <div>
          <h2 class="text-xl font-semibold">
            GitHub Issues Tracker
          </h2>
        </div>
      </div>

      <!-- Strp-02 : -->
      <!-- Using Daisy UI  -->
      <div class="flex gap-2 ">

        <!-- navbar end part -->
        <div>
          <label class="input validator join-item">
            <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </g>
            </svg>
            <input id="input-search" type="text" placeholder="Search issues..." required />
          </label>
        </div>

        <button id="issue_Search" class="btn btn-primary ">+ New Issue</button>
      </div>
    </div>
  </header>

  <!-- step-02: -->
   <!-- button section -->
  <section class=" my-6 w-11/12 mx-auto ">
    <div id="btndiv" class="bg-white p-4 rounded-xl shadow-sm">
      <button onclick="filterissues('all'), togglebtn ('all')" id="all" class="btn text-white btn-primary">All</button>
      <button onclick="filterissues('open'), togglebtn ('open')" id="open" class="btn  ">Open</button>
      <button onclick="filterissues('closed'), togglebtn('closed')" id="closed" class="btn ">Closed</button>
    </div>
  </section>

<!-- step-03 : -->
  <section class="w-11/12 mx-auto">
    <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between">
      <!-- left part -->
      <div class="flex gap-2">
        <div class="bg-slate-300 h-10 w-10  rounded-full "><img class="mx-auto p-1" src="./assets/Aperture.png" alt="">
        </div>
        <div>
          <h2 class="font-semibold text-xl"><span id="totalIssue">0</span> Issues</h2>
          <p class="text-[#64748B]">Track and manage your project issues</p>
        </div>
      </div>

      <!-- right part -->
      <div class="flex gap-2 justify-center items-center">
        <div class="bg-green-600 h-3 w-3 rounded-lg"></div>
        <p>Open</p>
        <div class="bg-[#A855F7] h-3 w-3 rounded-lg "></div>
        <p>Closed</p>
      </div>
  </section>

  <!-- step-04 : -->
   <!-- all issue container -->
  <section id="all_issues_container" class="w-11/12 mx-auto bg-gray-200 grid  lg:grid-cols-4 sm:grid-cols-2">
  </section>

  <!-- step-05 -->
<!-- for spinner -->
   <section id="spinner" class="flex justify-center items-center py-10 hidden">
      <span class="loading loading-bars loading-xl"></span>
     </section>

<!--step -06   -->
  <!-- Modal from daisy ui -->
   
   <dialog id="word_modal" class="modal  modal-middle">
  <div class="modal-box">

   <div id="details_container" class="space-y-5">
  
   </div>
    <div  class="modal-action">
      <form method="dialog">
        <!-- if there is a button in form, it will close the modal -->
        <button class="btn btn-primary outline-none">Close</button>
      </form>
    </div>
  </div>
  </dialog>
  


    <script src="./script/index.js"></script>
</body>
</html>
